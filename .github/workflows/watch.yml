name: Apple Watch app

on:
  push:
    branches: [main]
    paths: ['watch/**', '.github/workflows/watch.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Test the physics core
        working-directory: watch/GutterCore
        run: |
          set -o pipefail
          swift test 2>&1 | tail -60
      - name: Generate the Xcode project
        working-directory: watch
        run: brew install xcodegen && xcodegen generate
      - name: Build for the watch simulator
        working-directory: watch
        run: |
          set -o pipefail
          xcodebuild -project Gutterball.xcodeproj -scheme GutterballWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error|warning: unre|BUILD" | head -80
      - name: Run it on an Apple Watch simulator and take screenshots
        working-directory: watch
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'watchOS' in k for x in v if 'Ultra' in x['name'] or 'Series' in x['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name "Gutterball.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=com.whitewolfcreativeworks.gutterball.watchkitapp
          mkdir -p shots
          shot() { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          # the plunger being pulled, then the race
          xcrun simctl launch "$UDID" $BID -autoplay; sleep 3; shot a-plunger; sleep 7; shot b-race
          xcrun simctl terminate "$UDID" $BID
          # inside tube one and tube two
          xcrun simctl launch "$UDID" $BID -autoplay -at 500; sleep 7; shot c-tube1
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -autoplay -at 1300; sleep 7; shot d-tube2
          xcrun simctl terminate "$UDID" $BID
          # too slow for the gap: into the safety net, and the beam lifting you back
          xcrun simctl launch "$UDID" $BID -autoplay -at 735 -speed 12; sleep 5; shot e-net; sleep 1.5; shot f-lift; sleep 2; shot g-back
          xcrun simctl terminate "$UDID" $BID
          ls -la shots
          # print each screenshot (shrunk) into the log as base64, so it can be read back without artifact storage
          set +x
          for f in shots/*.png; do
            sips -Z 360 "$f" --out "$f.small.png" >/dev/null
            b=$(basename "$f" .png)
            base64 -i "$f.small.png" | fold -w 1000 | sed "s/^/SHOT $b /"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screenshots
          path: watch/shots
          if-no-files-found: ignore
